<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - NeuroPausa</title>
    <link rel="stylesheet" href="../assets/styles/register.css">
</head>
<body>

    <div class="register-container">
        <div class="register-box">
            <img src="../assets/images/ImagenNeuroPausaLogo.png" alt="Logo NeuroPausa" class="logo">
            <h1>Crear cuenta</h1>
            <p>Empieza tu camino hacia el bienestar</p>

            <form id="formulario-registro">

                <div class="input-box">
                    <input type="text" id="nombre-input" placeholder="Nombre" required>
                </div>

                <div class="input-box">
                    <input type="text" id="apellido-input" placeholder="Apellido" required>
                </div>

                <div class="input-box">
                    <input type="email" id="correo-input" placeholder="Correo electrónico" required>
                </div>

                <div class="input-box">
                    <input type="password" id="password-input" placeholder="Contraseña" required>
                </div>

                <ul id="password-rules" style="display:none; list-style:none; padding:8px 12px; margin:4px 0 12px 0; font-size:12px; text-align:left; color:#666; background:#f8f9fa; border-radius:8px;">
                    <li id="rule-len">• Mínimo 8 caracteres</li>
                    <li id="rule-upper">• Al menos una letra mayúscula</li>
                    <li id="rule-num">• Al menos un número</li>
                </ul>

                <div class="input-box">
                    <input type="password" id="confirmar-password-input" placeholder="Confirmar contraseña" required>
                </div>

                <p id="mensaje-error" style="color: red; display: none;"></p>

                <button type="submit" class="register-btn">Registrarse</button>

            </form>

            <div class="extra-links">
                <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
            </div>
        </div>
    </div>

    <script>
        // URL del backend: cambia esto según dónde estés probando
        const API_URL = 'http://127.0.0.1:5000';
        // const API_URL = 'https://neuropausa-backend.onrender.com'; // producción

        const passwordInput = document.getElementById('password-input');
        const passwordRules = document.getElementById('password-rules');
        passwordInput.addEventListener('focus', () => {
            passwordRules.style.display = 'block';
        });
        passwordInput.addEventListener('input', () => {
            passwordRules.style.display = 'block';
            const val = passwordInput.value;
            document.getElementById('rule-len').style.color = val.length >= 8 ? '#2e7d32' : '#c62828';
            document.getElementById('rule-upper').style.color = /[A-Z]/.test(val) ? '#2e7d32' : '#c62828';
            document.getElementById('rule-num').style.color = /[0-9]/.test(val) ? '#2e7d32' : '#c62828';
        });

        document.getElementById('formulario-registro').addEventListener('submit', async function(event) {
            event.preventDefault();

            const errorMsg = document.getElementById('mensaje-error');
            errorMsg.style.display = 'none';

            const nombrePaciente = document.getElementById('nombre-input').value;
            const apellidoPaciente = document.getElementById('apellido-input').value;
            const correoPaciente = document.getElementById('correo-input').value;
            const password = document.getElementById('password-input').value;
            const confirmPassword = document.getElementById('confirmar-password-input').value;

            // Validación en el frontend
            if (password !== confirmPassword) {
                errorMsg.textContent = "Las contraseñas no coinciden";
                errorMsg.style.display = 'block';
                return;
            }

            if (password.length < 8 || !/[A-Z]/.test(password) || !/[0-9]/.test(password)) {
                errorMsg.textContent = "La contraseña debe tener al menos 8 caracteres, una mayúscula y un número";
                errorMsg.style.display = 'block';
                return;
            }

            const boton = document.querySelector('.register-btn');
            const textoOriginal = boton.innerHTML;
            boton.innerHTML = "Registrando...";
            boton.disabled = true;

            try {
                const respuesta = await fetch(`${API_URL}/api/registrar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nombre: nombrePaciente,
                        apellidos: apellidoPaciente,
                        correo: correoPaciente,
                        password: password,
                        confirmPassword: confirmPassword
                    })
                });

                const data = await respuesta.json();

                if (respuesta.ok) {
                    alert("¡Registro exitoso! Revisa tu bandeja de entrada.");
                    window.location.href = "login.html";
                } else {
                    errorMsg.textContent = data.error || data.mensaje || "Error desconocido";
                    errorMsg.style.display = 'block';
                }

            } catch (error) {
                console.error("Error al conectar:", error);
                errorMsg.textContent = "No se pudo conectar con el servidor.";
                errorMsg.style.display = 'block';
            } finally {
                boton.innerHTML = textoOriginal;
                boton.disabled = false;
            }
        });
    </script>

</body>
</html>
