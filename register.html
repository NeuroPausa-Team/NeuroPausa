<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - NeuroPausa</title>
    <link rel="stylesheet" href="assets/styles/register.css">
</head>
<body>

    <div class="register-container">
        <div class="register-box">
            <img src="assets/images/ImagenNeuroPausaLogo.png" alt="Logo NeuroPausa" class="logo">
            
            <h1>Crear cuenta</h1>
            <p>Empieza tu camino hacia el bienestar</p>

            <!-- Agregamos el id="formulario-registro" aquí -->
            <form id="formulario-registro">

                <div class="input-box">
                    <!-- Agregamos el id="nombre-input" aquí -->
                    <input type="text" id="nombre-input" placeholder="Nombre" required>
                </div>

                <div class="input-box">
                    <!-- Agregamos el id="apellido-input" aquí -->
                    <input type="text" id="apellido-input" placeholder="Apellido" required>
                </div>

                <div class="input-box">
                    <!-- Agregamos el id="correo-input" aquí -->
                    <input type="email" id="correo-input" placeholder="Correo electrónico" required>
                </div>

                <div class="input-box">
                    <input type="password" placeholder="Contraseña" required>
                </div>

                <div class="input-box">
                    <input type="password" placeholder="Confirmar contraseña" required>
                </div>

                <button type="submit" class="register-btn">Registrarse</button>

            </form>

            <div class="extra-links">
                <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
            </div>
        </div>
    </div>

    <!-- CÓDIGO ACTUALIZADO: Envío de correo directo con Brevo API -->
    <script>
        document.getElementById('formulario-registro').addEventListener('submit', async function(event) {
            // Evita que la página se recargue automáticamente
            event.preventDefault();

            // Obtenemos los valores de nombre y correo
            const nombrePaciente = document.getElementById('nombre-input').value;
            const correoPaciente = document.getElementById('correo-input').value;

            // Cambiamos el texto del botón para que el usuario sepa que está cargando
            const boton = document.querySelector('.register-btn');
            const textoOriginal = boton.innerHTML;
            boton.innerHTML = "Registrando...";
            boton.disabled = true;

            try {
                // Petición directa a la API de Brevo
                const respuesta = await fetch('https://api.brevo.com/v3/smtp/email', {
                    method: 'POST',
                    headers: {
                        'accept': 'application/json',
                        'api-key': 'PEGA_AQUI_TU_API_KEY_DE_BREVO', // <-- REEMPLAZA ESTO CON TU API KEY REAL DE BREVO
                        'content-type': 'application/json'
                    },
                    body: JSON.stringify({
                        sender: {
                            name: "NeuroPausa",
                            email: "neuropausa2@gmail.com"
                        },
                        to: [{
                            email: correoPaciente,
                            name: nombrePaciente
                        }],
                        subject: "¡Bienvenido a NeuroPausa!",
                        htmlContent: `<html><body><h1>¡Hola ${nombrePaciente}!</h1><p>Gracias por registrarte en NeuroPausa. Tu camino hacia el bienestar ha comenzado.</p></body></html>`
                    })
                });

                if (respuesta.ok) {
                    alert("¡Registro exitoso! Revisa tu bandeja de entrada.");
                    // Redirige automáticamente al inicio de sesión
                    window.location.href = "login.html";
                } else {
                    const errorData = await respuesta.json();
                    alert("Hubo un problema con el registro: " + (errorData.message || "Error desconocido"));
                }

            } catch (error) {
                console.error("Error al conectar:", error);
                alert("No se pudo conectar con el servicio de correo.");
            } finally {
                // Restauramos el botón a la normalidad
                boton.innerHTML = textoOriginal;
                boton.disabled = false;
            }
        });
    </script>

</body>
</html>
